name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build-test-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore DisciplineTimeline.sln

      - name: Build
        run: dotnet build DisciplineTimeline.sln -c Release --no-restore

      - name: Test
        run: dotnet test DisciplineTimeline.sln -c Release --no-build

      - name: Publish win-x64
        run: >
          dotnet publish src/DisciplineTimeline.App/DisciplineTimeline.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o artifacts/win-x64

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: DisciplineTimeline-win-x64
          path: artifacts/win-x64
          if-no-files-found: error
